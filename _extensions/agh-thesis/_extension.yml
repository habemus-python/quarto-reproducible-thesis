title: AGH Thesis (PDF)
version: 0.0.0
quarto-required: ">=1.4.0"

contributes:
  formats:
    pdf:
      documentclass: scrartcl
      classoption:
        - toc=bib
      papersize: A4
      geometry:
        - margin=3.5cm
      fontsize: 11pt
      openright: true
      toc: true
      toc-depth: 3
      number-sections: true
      
      cite-method: biblatex
      biblatexoptions:
        - backref=true
        - backend=biber
        - style=numeric
        - natbib=true
      bibliography: refs.bib

      header-includes: |
        \usepackage{graphicx,epigraph,xcolor,etoolbox,abstract}
        \renewcommand{\abstracttextfont}{\small}  

        \definecolor{aghgreen}{HTML}{00693C}
        \definecolor{aghblack}{HTML}{1E1E1E}
        \definecolor{aghred}{HTML}{A71930}
        \linespread{1.25}
        \renewcommand*{\bibfont}{\small}
        
        % 1. Safely force sections to new pages
        \AddToHook{cmd/section/before}{\clearpage}
        
        \newcommand{\techword}[1]{{\normalfont\textsc{#1}}}
        
        % 2. Safely redefine TOC without infinite loops
        \makeatletter
        \@ifundefined{myoldtoc}{
          \let\myoldtoc\tableofcontents
          \renewcommand{\tableofcontents}{
            \clearpage
            \thispagestyle{empty}
            \myoldtoc
            \clearpage
          }
        }{}
        \makeatother

        \usepackage[autostyle]{csquotes}
        \frenchspacing

        \setkomafont{section}{\normalfont\Large\bfseries}
        \setkomafont{subsection}{\normalfont\large\bfseries}
        \usepackage{scrlayer-scrpage}
        \clearpairofpagestyles
        \cfoot*{\pagemark}

      colorlinks: true
      linkcolor: aghred
      urlcolor: aghred
      citecolor: aghgreen

      template-partials:
        - "partials/before-body.tex"

      format-resources:
        - logo_AGH.pdf
        - AI_poziom_1.pdf
